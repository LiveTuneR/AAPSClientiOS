name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          sed -i '' 's/YOUR_APPLE_TEAM_ID//' Config/Local.xcconfig
          xcodegen generate
      - name: Build iOS app and Watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project AAPSClientiOS.xcodeproj \
            -scheme AAPSClientiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AAPSClientiOS.xcodeproj \
            -scheme AAPSClientiOSTests \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO | xcpretty
